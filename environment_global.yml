# Plik z globalnymi zależnościami wspólnymi dla wszystkich środowisk
name: inzynierka_fusion
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  - numpy<2.0.0
  - pip
  - pip:
    - timm==0.9.12
    - transformers==4.32.1
    - pycocotools==2.0.6
    - torchmetrics==1.2.1
    - shapely==2.0.4
    - pytorch-lightning==2.0.4
    - einops
    - mmengine
    - terminaltables
    - prettytable
    - openmim
    - albumentations==1.3.1
    - opencv-python-headless==4.8.1.78
    - scikit-image==0.22.0
    - scikit-learn==1.3.2
    - scipy==1.11.4
    - tqdm==4.65.0
    - tensorboard==2.15.1
    - matplotlib==3.7.1
    - Pillow==9.5.0